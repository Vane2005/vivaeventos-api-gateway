spring.application.name=vivaeventos-api-gateway
server.port=8080

# Rutas hacia los servicios
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=event-service
spring.cloud.gateway.routes[1].uri=http://event-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/events/**,/api/v1/discount-codes/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://order-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.routes[3].id=ticket-service
spring.cloud.gateway.routes[3].uri=http://ticket-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/tickets/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://notification-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[5].id=dashboard-service
spring.cloud.gateway.routes[5].uri=http://dashboard-service:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/dashboard/**

# JWT secret (debe ser igual al del user-service)
jwt.secret=your-secret-key-here-must-be-at-least-256-bits-long